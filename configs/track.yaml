# Frozen by T00. Changing waypoint count, reach radius, or command limits
# requires a full-team ack. Command limits must stay identical to policy.yaml.

topics:
  pose: /S10_BASE_POSE
  nav_cmd: /S10_NAV_CMD

# Official KeyboardInterface ranges. Values enter the 57-D command slot unscaled.
command:
  vx: [-1.0, 1.0]
  vy: [-0.6, 0.6]
  wz: [-1.0, 1.0]

track:
  waypoint_count: 33
  first_id: 0
  last_id: 32
  reach_radius_m: 0.20
  distance_mode: xy
  body_name: base_link
  overlay_geom_group: 2

start:
  base_pos_xyz: [0.0, -2.5, 0.2]
  base_quat_wxyz: [1.0, 0.0, 0.0, 0.0]
  heading_axis: +X
  # WP0 is at +Y relative to the start pose; AutoNav must yaw before driving.
  waypoint0_xyz: [0.0, -1.725, 0.0]
  # StandUpState only accepts `c` after 2 * stand_duration_ (2.0 s).
  min_stand_wait_s: 4.0

lookahead:
  switch_distance_straight_m: 1.60
  switch_distance_turn_m: 0.80
  switch_distance_maze_m: 0.45
  weight: 0.35
  # Do not look past these ids or the timer start/stop can miss the 0.2 m disk.
  no_cross_ids: [0, 32]

speed:
  nominal_vx: 0.70
  maze_vx: 0.35
  maze_waypoint_ids: [28, 29, 30, 31, 32]

# TA navigation control law. Not frozen; may be tuned without a full-team ack.
control:
  yaw_gain: 2.0              # wz = clip(yaw_gain * heading_error)
  yaw_threshold_rad: 0.35    # pure-yaw startup when |heading_error| exceeds this
  turn_angle_threshold_rad: 0.785  # segment bend > ~45deg is treated as a "turn"

# TA stall / failure detection. Drives the collect-mode teleport + metadata.
stall:
  window_s: 5.0              # sliding window for displacement
  min_displacement_m: 0.30   # below this displacement in window -> stall
  tumble_roll_pitch_rad: 1.047  # |roll| or |pitch| above ~60deg -> tumble
  out_of_bounds_margin_m: 2.0

# Positions copied from track_overlay.xml geom pos. TA must parse the XML at
# runtime as well; this list is the unit-test fixture, not a second source of truth.
