schema_version: 1
topics:
  sample: /S10_TD_SAMPLE
  autonav_status: /S10_AUTONAV_STATUS
collection:
  # All waypoints are route-covered. TH owns learned-success labels for these segments.
  privileged_segments: [[16, 17]]
  privileged_target_waypoints: [28, 29, 30, 31, 32]
  rate_hz: 50
  pre_failure_seconds: 5.0
  focus_window_seconds: 10.0
  post_teleport_seconds: 5.0
  chunk_size: 5000
  teacher_source: official
  initial_pose_jitter_m: 0.03
  initial_yaw_jitter_rad: 0.05
terrain_command:
  forward_roi_x_indices: [4, 11]
  wheel_corridor_y_indices: [3, 8]
  step_threshold_m: 0.25
  drop_threshold_m: 0.20
  slope_threshold_m: 0.35
  slope_risk_weight: 0.45
  unknown_risk_start: 0.45
  unknown_risk_weight: 0.70
  risk_deadband: 0.25
  flat_speed_scale: 1.05
  minimum_speed_scale: 0.95
  obstacle_deadband_m: 0.12
  avoidance_gain: 0.15
  maximum_avoidance_vy: 0.03
  slew_per_policy_step: [0.04, 0.03, 0.06]
failure_codes:
  none: 0
  stall: 1
  tumble: 2
  out_of_bounds: 3
teacher_source_codes:
  official: 0
  privileged: 1
contrast_codes:
  normal: 0
  failure_approach: 1
  success_control: 2
